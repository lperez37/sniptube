name: Android debug build

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install pinned SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test, lint and assemble
        run: ./android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:compileDebugAndroidTestKotlin :app:assembleDebug --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: sniptube-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
